[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diligence-verify"
version = "0.1.0"
description = "Auditable financial extraction from SEC filings"
requires-python = ">=3.11"
dependencies = [
  "edgartools>=4,<6", "httpx>=0.27,<1", "pydantic>=2,<3",
  "openai>=1,<3", "tenacity>=8,<10", "rank-bm25>=0.2,<1",
  "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "pyyaml>=6,<7",
  "python-dotenv>=1,<2", "pandas>=2,<4", "typer>=0.12,<1",
  "pytest>=8,<10", "streamlit>=1.35,<2",
]

[project.scripts]
dv = "dv.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
