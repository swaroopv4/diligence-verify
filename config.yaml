sec:
  user_agent_env: SEC_USER_AGENT
  max_requests_per_second: 8
companies:
  dev: [AAPL, MSFT, CRM]
  full: [AAPL, MSFT, GOOGL, AMZN, META, NVDA, ADBE, CRM, ORCL, INTC, CSCO, IBM, NFLX, INTU, NOW]
filing:
  form: 10-K
  which: latest
llm:
  temperature: 0
  max_output_tokens: 2000
  timeout_seconds: 120
  providers:
    - {name: gemini, base_url: 'https://generativelanguage.googleapis.com/v1beta/openai/', api_key_env: GEMINI_API_KEY, model: gemini-3.5-flash-lite}
    - {name: groq, base_url: 'https://api.groq.com/openai/v1', api_key_env: GROQ_API_KEY, model: FILL_IN_CURRENT_FREE_MODEL}
    - {name: openrouter, base_url: 'https://openrouter.ai/api/v1', api_key_env: OPENROUTER_API_KEY, model: FILL_IN_CURRENT_FREE_MODEL}
    - {name: ollama, base_url: 'http://localhost:11434/v1', api_key_env: null, model: FILL_IN_LOCAL_MODEL}
  reference_prices_per_million: {input: 3.00, output: 15.00}
retrieval: {top_k: 5, retry_extra_k: 5}
verification: {max_retries: 2, relative_tolerance: 0.005, eps_absolute_tolerance: 0.01}
metrics:
  revenue:
    row_labels: [total net sales, net sales, total revenues, revenues, revenue, net revenue]
    exclude_labels: [per share, cost of, deferred, segment]
    kind: duration
    unit: USD
    query: total net revenue sales net sales total revenues
    xbrl_tags: [RevenueFromContractWithCustomerExcludingAssessedTax, Revenues, SalesRevenueNet, RevenueFromContractWithCustomerIncludingAssessedTax]
  net_income:
    row_labels: [net income, net earnings, net loss]
    exclude_labels: [per share, per diluted share, noncontrolling, non-controlling, available to common, comprehensive]
    kind: duration
    unit: USD
    query: net income net earnings
    xbrl_tags: [NetIncomeLoss]
  operating_income:
    row_labels: [operating income, operating loss, income from operations, loss from operations]
    exclude_labels: [per share, segment, products operating income]
    kind: duration
    unit: USD
    query: operating income income from operations
    xbrl_tags: [OperatingIncomeLoss]
  operating_cash_flow:
    row_labels: [net cash provided by operating activities, net cash provided by (used in) operating activities, net cash from operations, cash generated by operating activities, cash provided by operating activities, net cash provided by (used for) operating activities]
    exclude_labels: [per share, investing, financing]
    kind: duration
    unit: USD
    query: net cash provided by operating activities
    xbrl_tags: [NetCashProvidedByUsedInOperatingActivities]
  eps_diluted:
    row_labels: [diluted]
    exclude_labels: [basic, weighted, shares outstanding, shares used, number of shares]
    kind: duration
    unit: USD/shares
    query: diluted earnings per share diluted net income per share
    xbrl_tags: [EarningsPerShareDiluted]
  total_assets:
    row_labels: [total assets]
    exclude_labels: [per share, current assets, non-current assets]
    kind: instant
    unit: USD
    query: total assets balance sheet
    xbrl_tags: [Assets]
  total_liabilities:
    row_labels: [total liabilities]
    exclude_labels: [per share, and stockholders, and shareholders, and equity, current liabilities, non-current liabilities]
    kind: instant
    unit: USD
    query: total liabilities
    xbrl_tags: [Liabilities]
  cash:
    row_labels: [cash and cash equivalents, cash cash equivalents]
    exclude_labels: [per share, restricted, short-term investments, marketable securities, beginning, increase, decrease]
    kind: instant
    unit: USD
    query: cash and cash equivalents
    xbrl_tags: [CashAndCashEquivalentsAtCarryingValue]
  stockholders_equity:
    row_labels: [stockholders equity, shareholders equity, stockholders deficit, shareholders deficit, total equity]
    exclude_labels: [per share, liabilities, noncontrolling, non-controlling]
    kind: instant
    unit: USD
    query: total stockholders equity shareholders equity
    xbrl_tags: [StockholdersEquity, StockholdersEquityIncludingPortionAttributableToNoncontrollingInterest]
